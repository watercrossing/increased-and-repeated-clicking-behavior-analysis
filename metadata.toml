install_script = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/Dockerfile"
use = "This is a statistical re-analysis artifact: it reproduces the quantitative results of an observational field study from a fixed dataset. It is not a phishing tool, a detection system or a simulation platform, and it cannot be used to run or evaluate phishing campaigns.\n\nThe dataset is survey and phishing-simulation log data from staff at a single university, already pseudonymised and de-identified. Because the population is one institution, combinations of the banded attributes (age, gender, role and organisational tenure) should be treated as potentially identifying; please do not attempt re-identification or adversarial linkage.\n\nLimitations. The qualitative analysis is only partly reproducible on this branch: Cohen's kappa and the seven open-text category counts are derived from the coders' labels, but the four closed-format counts in the same figure remain literals, because this branch regenerates the submitted figure. They do derive from the reasons_click survey item with no further filter, and the camera-ready branch computes them. One of them is wrong in the submitted paper: the count of participants who said they thought the e-mail was legitimate is given as 39 where the data gives 40, a manual entry error in the figure code confirmed by the analysis author; the other three are correct. The H2 mediation model uses the binary click indicator where the paper's text describes the three-level level-of-compromise measure; this artifact keeps the code as submitted, and the specification is corrected in the camera-ready version. The power analysis and the gender-category counts are reported in the paper but are not computed by this artifact. One number is deliberately corrected relative to the submitted paper: the mean age, which the paper gives as 39.3 (SD 10.4) and this artifact computes as 39.8 (SD 11.0); see README.md."
destructive = "None. The artifact only reads its own input file and writes into a results/ directory it creates. It makes no network connections and is run with --network none."
claim1 = "Click and credential-submission rates increased across the four phishing simulations: click rates of 4.5, 17.6, 18.0 and 33.6 percent, and compromise rates of 0.4, 5.1, 6.0 and 9.0 percent, on an analysis sample of N=986."
script1 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected1 = "results/analysis.log contains \"Click rates by simulation\" and \"Compromise rates by simulation\" tables printing exactly these percentages, and \"N Original (df_analysis_filt): 986\". See the claims table in README.md."
claim2 = "H1: being compromised in one simulation is associated with being compromised in the next, and this association is not mediated by the six psychological factors."
script2 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected2 = "The H1 lavaan mediation model in results/analysis.log reproduces the direct and indirect effects in the paper's H1 table, with no indirect path reaching significance."
claim3 = "H2: falling for a simulation is associated with training intentions positively via negative emotions and training acceptance, and negatively via self-efficacy."
script3 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected3 = "The H2 lavaan mediation model in results/analysis.log reproduces the indirect effects in the paper's H2 table, with those three paths significant in the stated directions."
claim4 = "H3 between participants: of the six psychological factors, only optimism bias is reliably associated with repeat clicking, with beta 0.42, SE 0.18, p .029 on the repeat-clicking subset of N=115."
script4 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected4 = "The pooled multiple-imputation logistic regression table in results/analysis.log gives optimism_bias estimate 0.4227, std.error 0.1845, p 0.0294, and no other psychological predictor with p < .05. The same values drive forest_plot_odds_ratios.pdf."
claim5 = "H3 within participants: email detection difficulty is the robust situational correlate of clicking (beta 0.83, z 4.64, OR 2.30), while participant-level individual differences account for approximately 16 percent of variance."
script5 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected5 = "The \"H4 pooled fixed effects\" table in results/analysis.log gives difficulty estimate 0.8345, z 4.644, OR 2.30, and mean(icc_vals) is 0.159."
claim6 = "The qualitative coding of self-reported reasons for clicking achieved Cohen's kappa of 0.881 across 120 double-coded responses, and the seven open-text reason categories have counts 13, 12, 3, 2, 2, 1 and 1."
script6 = "https://github.com/watercrossing/increased-and-repeated-clicking-behavior-analysis/blob/main/run_analysis.sh"
expected6 = "results/qualitative.log prints \"Cohen's kappa = 0.881\" on N = 120, and a table whose derived counts equal the recorded ones. The document asserts both with stopifnot, so a mismatch fails the run rather than being left to the reader."
